services:
  postgres:
    image: postgres:16-alpine
    container_name: perf-postgres
    environment:
      POSTGRES_USER: perf
      POSTGRES_PASSWORD: perf123
      POSTGRES_DB: performance
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perf -d performance"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: perf-backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: perf-frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
